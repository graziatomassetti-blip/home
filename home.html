<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WhatsApp</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0f14">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body { height:100%; overflow:hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background:
      radial-gradient(ellipse at 25% 20%, rgba(120,70,30,.30) 0%, transparent 55%),
      radial-gradient(ellipse at 78% 82%, rgba(40,60,90,.35) 0%, transparent 55%),
      linear-gradient(165deg, #1a1410 0%, #0d0f14 48%, #12100c 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    user-select:none;
    -webkit-user-select:none;
  }

  .app {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    text-decoration:none;
    position:relative;
    transition:transform .12s ease;
  }

  .app:active { transform:scale(.9); }

  .icon-wrap {
    width:72px;
    height:72px;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    box-shadow:0 6px 20px rgba(0,0,0,.5);
  }

  .icon-wrap img { width:100%; height:100%; display:block; }

  .app-label {
    font-size:13px;
    color:#fff;
    text-shadow:0 1px 5px rgba(0,0,0,.85);
    font-weight:400;
  }

</style>
</head>
<body>

  <a class="app" href="index.html">
    <div class="icon-wrap">
      <img src="icon-192.png" alt="">
    </div>
    <div class="app-label">WhatsApp</div>
  </a>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>

</body>
</html>
